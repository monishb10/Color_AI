<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eef2ff" />
  <title>KURAMA — AI Color Intelligence</title>

  <!-- Google Fonts: Raleway (all weights) & JetBrains Mono for hex codes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Raleway:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Three.js CDN Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <style>
    :root {
      --font-sans: "Raleway", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: "Raleway", sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      --font-raleway: "Raleway", sans-serif;

      --kurama-primary: #2F69FF;
      --kurama-secondary: #A8C1FF;
      --kurama-accent: #0E2AC5;
      --kurama-text: #111111;
      --kurama-surface: #FFFFFF;
      --kurama-bg: #F7FAFC;

      --panel: rgba(255, 255, 255, .34);
      --panel-strong: rgba(255, 255, 255, .58);
      --border: rgba(255, 255, 255, .66);
      --ink: #101114;
      --muted: #677084;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      overflow: hidden;
      color: var(--ink);
      background: #f7fafc;
      font-family: var(--font-raleway);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, textarea { font: inherit; }
    button { border: 0; }

    #bgGradient {
      position: fixed;
      inset: 0;
      z-index: -10;
      background:
        radial-gradient(circle at 50% 45%,
          #ffffff 0%,
          #ecefff 36%,
          #c2d1ff 100%);
      transition: background 1s var(--ease);
    }

    #webglWrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    #webgl { width: 100%; height: 100%; display: block; }

    .app-shell {
      position: relative;
      z-index: 10;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: 0 28px 24px;
      pointer-events: none;
    }

    .header {
      height: 92px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      opacity: 0;
      transform: translateY(-14px);
      transition: .8s var(--ease);
    }

    body.ready .header {
      opacity: 1;
      transform: none;
    }

    .brand {
      justify-self: start;
      font-family: var(--font-raleway);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .24em;
      color: #090a0c;
      pointer-events: auto;
    }

    .status {
      justify-self: center;
      display: inline-flex;
      gap: 9px;
      align-items: center;
      font-family: var(--font-raleway);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .18em;
      color: rgba(16, 17, 20, .64);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--kurama-primary);
      box-shadow: 0 0 12px rgba(47, 105, 255, .65);
    }

    .header-actions {
      justify-self: end;
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .glass-btn {
      height: 42px;
      min-width: 42px;
      border-radius: 999px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      color: #181a20;
      background: rgba(255, 255, 255, .28);
      border: 1px solid rgba(255, 255, 255, .58);
      box-shadow:
        inset 0 1.5px 2px rgba(255, 255, 255, .82),
        0 12px 30px rgba(20, 35, 80, .08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: .3s var(--ease);
    }

    .glass-btn:hover { transform: translateY(-2px); background: rgba(255, 255, 255, .4); }
    .glass-btn span { font-family: var(--font-raleway); font-size: 12px; font-weight: 600; }

    .workspace {
      flex: 1;
      display: grid;
      place-items: center;
      min-height: 0;
      opacity: 0;
      transform: translateY(24px);
      filter: blur(8px);
      transition: 1.1s .18s var(--ease);
    }

    body.ready .workspace {
      opacity: 1;
      transform: none;
      filter: none;
    }

    .chat-panel {
      pointer-events: auto;
      width: min(760px, calc(100vw - 56px));
      height: min(74vh, 760px);
      min-height: 580px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      border-radius: 30px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .52), rgba(255, 255, 255, .28));
      border: 1px solid rgba(255, 255, 255, .68);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .86),
        0 34px 90px rgba(25, 42, 90, .17);
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
    }

    .chat-top {
      min-height: 76px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(14, 42, 197, .08);
      background: rgba(255, 255, 255, .18);
    }

    .chat-title {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .mini-orb {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 40% 28%, #8da8ff 0%, #2f69ff 45%, #0e2ac5 72%, #020b40 100%);
      box-shadow:
        inset 0 2px 5px rgba(255, 255, 255, .45),
        0 6px 20px rgba(47, 105, 255, .3);
    }

    .chat-title-main {
      font-family: var(--font-raleway);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .16em;
    }

    .chat-sub {
      margin-top: 3px;
      font-family: var(--font-raleway);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .18em;
      color: rgba(16, 17, 20, .5);
      text-transform: uppercase;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-raleway);
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: .16em;
      color: rgba(16, 17, 20, .58);
      text-transform: uppercase;
    }

    .messages {
      overflow-y: auto;
      padding: 28px 24px 18px;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }

    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(14, 42, 197, .14);
      border-radius: 99px;
    }

    .empty-state {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 28px 14px;
      animation: rise .8s var(--ease) both;
    }

    .empty-kicker {
      font-family: var(--font-raleway);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--kurama-accent);
      margin-bottom: 16px;
    }

    .empty-state h1 {
      margin: 0;
      font-family: var(--font-raleway);
      font-size: clamp(34px, 5vw, 56px);
      line-height: .98;
      font-weight: 600;
      letter-spacing: -.03em;
      color: var(--ink);
    }

    .empty-state p {
      margin: 14px 0 0;
      font-family: var(--font-raleway);
      color: rgba(16, 17, 20, .62);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
    }

    .quick-prompts {
      margin-top: 26px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 560px;
    }

    .chip {
      cursor: pointer;
      padding: 9px 15px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .42);
      border: 1px solid rgba(255, 255, 255, .72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: rgba(16, 17, 20, .75);
      font-family: var(--font-raleway);
      font-size: 12px;
      font-weight: 600;
      transition: .25s var(--ease);
    }

    .chip:hover { transform: translateY(-2px); background: rgba(255, 255, 255, .65); color: #000; }

    .message-row {
      display: flex;
      margin: 0 0 16px;
      animation: messageIn .48s var(--ease) both;
    }

    .message-row.user { justify-content: flex-end; }
    .message-row.bot { justify-content: flex-start; }

    .bubble {
      max-width: 86%;
      border-radius: 22px;
      padding: 13px 16px;
      font-family: var(--font-raleway);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
    }

    .user .bubble {
      color: white;
      background:
        linear-gradient(145deg, rgba(47, 105, 255, .96), rgba(14, 42, 197, .92));
      border-bottom-right-radius: 7px;
      box-shadow: 0 12px 28px rgba(47, 105, 255, .18);
    }

    .bot .bubble {
      color: #16181e;
      background: rgba(255, 255, 255, .62);
      border: 1px solid rgba(255, 255, 255, .82);
      border-bottom-left-radius: 7px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .92),
        0 14px 36px rgba(30, 45, 85, .09);
    }

    .bot-text { margin: 0 0 14px; font-family: var(--font-raleway); font-size: 14px; font-weight: 500; line-height: 1.5; }

    .palette-card {
      margin-top: 14px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(14, 42, 197, .08);
      background: rgba(255, 255, 255, .45);
    }

    .palette-head {
      padding: 14px 16px 12px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      border-bottom: 1px solid rgba(14, 42, 197, .08);
    }

    .palette-name {
      font-family: var(--font-raleway);
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--ink);
    }

    .palette-mood {
      margin-top: 4px;
      font-family: var(--font-raleway);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .08em;
      color: rgba(16, 17, 20, .5);
      text-transform: uppercase;
    }

    .apply-btn {
      flex: 0 0 auto;
      cursor: pointer;
      padding: 8px 14px;
      border-radius: 999px;
      color: white;
      background: var(--kurama-primary);
      font-family: var(--font-raleway);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(47, 105, 255, .28);
      transition: .25s var(--ease);
    }

    .apply-btn:hover { transform: translateY(-1px) scale(1.02); box-shadow: 0 6px 18px rgba(47, 105, 255, .4); }

    .swatches {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: rgba(14, 42, 197, .06);
    }

    .swatch {
      min-width: 0;
      background: rgba(255, 255, 255, .75);
    }

    .swatch-color { height: 54px; }

    .swatch-meta { padding: 10px; }

    .swatch-role {
      font-family: var(--font-raleway);
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(16, 17, 20, .5);
      font-weight: 600;
    }

    .hex-btn {
      display: block;
      width: 100%;
      margin: 4px 0 0;
      padding: 0;
      text-align: left;
      cursor: pointer;
      background: none;
      color: #11131a;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 700;
      transition: color .15s;
    }
    .hex-btn:hover { color: var(--kurama-primary); }

    .swatch-usage {
      margin-top: 5px;
      color: rgba(16, 17, 20, .55);
      font-family: var(--font-raleway);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.35;
    }

    .contrast-box {
      padding: 12px 16px;
      border-top: 1px solid rgba(14, 42, 197, .08);
      background: rgba(255, 255, 255, .3);
    }

    .contrast-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(14, 42, 197, .05);
    }

    .contrast-row:last-child { border-bottom: 0; }

    .contrast-key,
    .contrast-value {
      font-family: var(--font-raleway);
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .contrast-key { color: rgba(16, 17, 20, .5); font-weight: 500; }
    .contrast-value { color: rgba(16, 17, 20, .85); font-weight: 700; }

    .system-msg {
      margin: 10px auto;
      width: fit-content;
      max-width: 80%;
      padding: 9px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .5);
      border: 1px solid rgba(255, 255, 255, .72);
      font-family: var(--font-raleway);
      font-size: 10px;
      font-weight: 500;
      line-height: 1.45;
      color: rgba(16, 17, 20, .68);
      text-align: center;
    }

    .thinking {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      min-width: 58px;
    }

    .thinking i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--kurama-primary);
      animation: dot 1s infinite ease-in-out;
    }

    .thinking i:nth-child(2) { animation-delay: .15s; }
    .thinking i:nth-child(3) { animation-delay: .3s; }

    .composer-wrap {
      padding: 14px 16px 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .26));
      border-top: 1px solid rgba(14, 42, 197, .08);
    }

    .composer {
      min-height: 58px;
      display: grid;
      grid-template-columns: 1fr 44px;
      gap: 10px;
      align-items: end;
      padding: 8px 8px 8px 16px;
      border-radius: 21px;
      background: rgba(255, 255, 255, .6);
      border: 1px solid rgba(255, 255, 255, .82);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .96),
        0 10px 24px rgba(33, 49, 90, .08);
    }

    #chatInput {
      width: 100%;
      resize: none;
      max-height: 126px;
      min-height: 40px;
      padding: 9px 0 6px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #11131a;
      font-family: var(--font-raleway);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.45;
    }

    #chatInput::placeholder { color: rgba(16, 17, 20, .4); }

    #sendBtn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: white;
      background:
        radial-gradient(circle at 50% 30%, #6f91ff 0%, var(--kurama-primary) 48%, var(--kurama-accent) 76%, #020b40 100%);
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, .35),
        0 8px 20px rgba(47, 105, 255, .28);
      transition: .3s var(--ease);
    }

    #sendBtn:hover { transform: scale(1.05); }
    #sendBtn:disabled { opacity: .45; cursor: default; transform: none; }

    .footline {
      height: 34px;
      display: grid;
      place-items: end center;
      font-family: var(--font-raleway);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .18em;
      color: rgba(16, 17, 20, .4);
      pointer-events: none;
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, #ffffff 0%, #eef2ff 45%, #dbe4ff 100%);
      transition: opacity .55s cubic-bezier(.65, 0, .35, 1), visibility .55s;
    }

    .loader.leave { opacity: 0; visibility: hidden; pointer-events: none; }

    .loader-inner {
      width: min(280px, 68vw);
      text-align: center;
    }

    .loader-status {
      font-family: var(--font-raleway);
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .24em;
      color: #6b7bb5;
    }

    .loader-bar {
      height: 2px;
      margin: 22px 0 15px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(14, 42, 197, .14);
    }

    .loader-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #5175ff, #0e2ac5);
      box-shadow: 0 0 14px rgba(47, 105, 255, .55);
      transition: width .28s var(--ease);
    }

    .loader-count {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .1em;
      font-weight: 700;
      color: #0e2ac5;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); filter: blur(6px); }
      to   { opacity: 1; transform: none; filter: none; }
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(12px); filter: blur(4px); }
      to   { opacity: 1; transform: none; filter: none; }
    }

    @keyframes dot {
      0%, 80%, 100% { transform: scale(.65); opacity: .35; }
      40% { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 760px) {
      body { overflow: hidden; }
      .app-shell { padding: 0 12px 10px; }
      .header {
        height: 70px;
        grid-template-columns: 1fr auto;
      }
      .status { display: none; }
      .brand { font-size: 17px; }
      .glass-btn { height: 38px; min-width: 38px; padding: 0 12px; }
      .chat-panel {
        width: 100%;
        height: calc(100svh - 104px);
        min-height: 0;
        border-radius: 24px;
      }
      .chat-top { min-height: 68px; padding: 16px 18px; }
      .messages { padding: 20px 16px 14px; }
      .bubble { max-width: 94%; }
      .swatches { grid-template-columns: repeat(2, 1fr); }
      .footline { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="bgGradient"></div>

  <div id="webglWrap">
    <canvas id="webgl"></canvas>
  </div>

  <div class="loader" id="loader">
    <div class="loader-inner">
      <div class="loader-status" id="loaderStatus">CALIBRATING COLOR ENGINE</div>
      <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
      <div class="loader-count" id="loaderCount">000%</div>
    </div>
  </div>

  <main class="app-shell">
    <header class="header">
      <div class="brand">KURAMA</div>

      <div class="status">
        <span class="status-dot"></span>
        <span>COLOR INTELLIGENCE / ONLINE</span>
      </div>

      <div class="header-actions">
        <button class="glass-btn" id="resetBtn" type="button" title="Reset Palette and Field">
          <span>Reset</span>
        </button>
      </div>
    </header>

    <section class="workspace">
      <div class="chat-panel">
        <div class="chat-top">
          <div class="chat-title">
            <div class="mini-orb"></div>
            <div>
              <div class="chat-title-main">KURAMA</div>
              <div class="chat-sub">AI COLOR INTELLIGENCE</div>
            </div>
          </div>

          <div class="online">
            <span class="status-dot"></span>
            ONLINE
          </div>
        </div>

        <div class="messages" id="messages">
          <div class="empty-state" id="emptyState">
            <div class="empty-kicker">COLOR SYSTEM GENERATOR</div>
            <h1>Describe what<br>you're designing.</h1>
            <p>I'll build a color system around it.</p>

            <div class="quick-prompts">
              <button class="chip" data-prompt="Create a professional color palette for a modern website">Website</button>
              <button class="chip" data-prompt="Create a clean color palette for a mobile app">Mobile App</button>
              <button class="chip" data-prompt="Create a dark AI dashboard color palette">Dashboard</button>
              <button class="chip" data-prompt="Create a minimal luxury portfolio palette">Portfolio</button>
              <button class="chip" data-prompt="Create a strong modern brand identity palette">Brand</button>
              <button class="chip" data-prompt="Create a dark tactical gaming UI color palette">Gaming</button>
              <button class="chip" data-prompt="Create a premium SaaS product color palette">SaaS</button>
              <button class="chip" data-prompt="Create a warm modern e-commerce color palette">E-commerce</button>
            </div>
          </div>
        </div>

        <div class="composer-wrap">
          <form class="composer" id="chatForm">
            <textarea
              id="chatInput"
              rows="1"
              maxlength="2000"
              placeholder="Describe a style, product, brand or color..."
            ></textarea>

            <button id="sendBtn" type="submit" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </section>

    <div class="footline">KURAMA / AI COLOR INTELLIGENCE / 2026</div>
  </main>

  <script type="module">
    import * as THREE from "three";

    // =========================================================
    // APP STATE
    // =========================================================
    const appState = {
      history: [],
      activePalette: null,
      isLoading: false,
      interaction: "idle" // idle | typing | thinking
    };

    const DEFAULT_THEME = {
      background: "#F7FAFC",
      surface: "#FFFFFF",
      primary: "#2F69FF",
      secondary: "#A8C1FF",
      accent: "#0E2AC5",
      text: "#111111"
    };

    const $ = (sel) => document.querySelector(sel);
    const messagesEl = $("#messages");
    const emptyState = $("#emptyState");
    const chatForm = $("#chatForm");
    const chatInput = $("#chatInput");
    const sendBtn = $("#sendBtn");
    const resetBtn = $("#resetBtn");
    const bgGradient = $("#bgGradient");

    // =========================================================
    // THREE.JS SCENE
    // =========================================================
    const canvas = $("#webgl");
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, 11);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x2f69ff, 1.6);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
    keyLight.position.set(-6, 10, 8);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 1.25);
    rimLight.position.set(8, 7, -8);
    scene.add(rimLight);

    const frontLight = new THREE.DirectionalLight(0xffffff, .45);
    frontLight.position.set(0, 0, 11);
    scene.add(frontLight);

    const sideBounceLight = new THREE.DirectionalLight(0xffffff, .3);
    sideBounceLight.position.set(-9, -2, 4);
    scene.add(sideBounceLight);

    let viewportWidth = 10;
    let viewportHeight = 6;

    function updateFrustumBounds() {
      const fovRad = THREE.MathUtils.degToRad(camera.fov);
      viewportHeight = 2 * Math.tan(fovRad / 2) * camera.position.z;
      viewportWidth = viewportHeight * (window.innerWidth / window.innerHeight);
    }
    updateFrustumBounds();

    const isMobile = window.innerWidth < 768;
    const ballCount = isMobile ? 54 : 96;
    const sphereGeometry = new THREE.SphereGeometry(1, 48, 48);
    const balls = [];

    const paletteCurrent = {
      pastel: new THREE.Color("#ECEFFF"),
      light: new THREE.Color("#A8C1FF"),
      medium: new THREE.Color("#2F69FF"),
      deep: new THREE.Color("#0A33BF"),
      glass: new THREE.Color("#4D80FF")
    };

    const paletteTarget = {
      pastel: new THREE.Color("#ECEFFF"),
      light: new THREE.Color("#A8C1FF"),
      medium: new THREE.Color("#2F69FF"),
      deep: new THREE.Color("#0A33BF"),
      glass: new THREE.Color("#4D80FF")
    };

    const roles = ["pastel", "light", "medium", "deep", "glass"];

    for (let i = 0; i < ballCount; i++) {
      let radius = .33;
      const rand = Math.random();

      if (rand < .3) radius = .27 + Math.random() * .12;
      else if (rand < .8) radius = .42 + Math.random() * .18;
      else radius = .66 + Math.random() * .21;

      const mass = Math.pow(radius, 3);
      const isGlass = Math.random() < .22;

      let role = "medium";
      if (!isGlass) {
        const cr = Math.random();
        if (cr < .25) role = "pastel";
        else if (cr < .55) role = "light";
        else if (cr < .85) role = "medium";
        else role = "deep";
      } else {
        role = "glass";
      }

      const baseColor = paletteCurrent[role];

      const mat = isGlass
        ? new THREE.MeshPhysicalMaterial({
            color: baseColor,
            roughness: .08,
            metalness: 0,
            clearcoat: 1,
            clearcoatRoughness: .03,
            transmission: .95,
            ior: 1.485,
            thickness: 2.2,
            specularColor: new THREE.Color("#ffffff"),
            specularIntensity: 1,
            attenuationColor: paletteCurrent.pastel,
            attenuationDistance: 1,
            emissive: baseColor,
            emissiveIntensity: .12,
            transparent: true,
            opacity: 1
          })
        : new THREE.MeshPhysicalMaterial({
            color: baseColor,
            roughness: .44,
            metalness: 0,
            clearcoat: .24,
            clearcoatRoughness: .35,
            emissive: baseColor,
            emissiveIntensity: .08,
            transparent: true,
            opacity: 1
          });

      const group = new THREE.Group();
      const mesh = new THREE.Mesh(sphereGeometry, mat);
      mesh.scale.setScalar(radius);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
      scene.add(group);

      balls.push({
        id: i,
        radius,
        mass,
        position: new THREE.Vector3(),
        velocity: new THREE.Vector3(),
        group,
        mesh,
        material: mat,
        role,
        isGlass,
        baseAngle: Math.random() * Math.PI * 2,
        depthBias: (Math.random() - .5) * 2.5
      });
    }

    function scatterFar(withVelocity = true) {
      const R = Math.max(viewportWidth, viewportHeight) * 1.35;
      for (const b of balls) {
        const a = Math.random() * Math.PI * 2;
        const px = Math.cos(a) * R * 1.25;
        const py = Math.sin(a) * R * .85;
        const pz = (Math.random() - .5) * 4;

        b.position.set(px, py, pz);
        b.group.position.copy(b.position);

        if (withVelocity) {
          b.velocity
            .set(-px, -py, -pz)
            .normalize()
            .multiplyScalar(.07 + Math.random() * .05);
        } else {
          b.velocity.set(0, 0, 0);
        }
      }
    }
    scatterFar(true);

    const mouse = { x: 99, y: 99, isDown: false };
    const mouseProj = new THREE.Vector3();
    const mouseWorld = new THREE.Vector3();
    const prevMouseWorld = new THREE.Vector3();
    let mouseSpeed = 0;

    window.addEventListener("pointermove", (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener("pointerdown", () => mouse.isDown = true);
    window.addEventListener("pointerup", () => mouse.isDown = false);

    function updateMouse3D() {
      mouseProj.set(mouse.x, mouse.y, .5);
      mouseProj.unproject(camera);

      const dir = mouseProj.sub(camera.position).normalize();
      const distance = -camera.position.z / dir.z;
      mouseWorld.copy(camera.position).add(dir.multiplyScalar(distance));
    }

    const tmp = new THREE.Vector3();
    const collideDiff = new THREE.Vector3();
    const relVel = new THREE.Vector3();
    const deltaPos = new THREE.Vector3();
    const rotAxis = new THREE.Vector3();

    const clock = new THREE.Clock();
    let entranceTime = 0;
    let loaded = false;
    let visible = true;

    document.addEventListener("visibilitychange", () => {
      visible = document.visibilityState === "visible";
    });

    function animate() {
      requestAnimationFrame(animate);
      if (!visible) return;

      const t = clock.getElapsedTime();
      updateMouse3D();

      mouseSpeed = mouseWorld.distanceTo(prevMouseWorld);
      if (mouseSpeed > 3) mouseSpeed = 3;
      prevMouseWorld.copy(mouseWorld);

      const interactionBoost =
        appState.interaction === "thinking" ? 1.35 :
        appState.interaction === "typing" ? 1.15 :
        1;

      for (const role of roles) {
        paletteCurrent[role].lerp(paletteTarget[role], .055);
      }

      hemiLight.groundColor.lerp(paletteCurrent.medium, .08);

      const centerY = 0;
      const clusterWide = Math.min(viewportWidth * .29, 4.1);
      const clusterTall = Math.min(viewportHeight * .28, 2.55);

      for (const b of balls) {
        const wobbleX = Math.sin(t * .42 + b.id * 1.31) * .0005 * interactionBoost;
        const wobbleY = Math.cos(t * .5 + b.id * 1.17) * .0005 * interactionBoost;
        const wobbleZ = Math.sin(t * .35 + b.id) * .00012;

        b.velocity.x += wobbleX;
        b.velocity.y += wobbleY;
        b.velocity.z += wobbleZ;

        const targetX = Math.cos(b.baseAngle) * clusterWide * (.38 + (b.id % 13) / 21);
        const targetY = centerY + Math.sin(b.baseAngle) * clusterTall * (.4 + (b.id % 9) / 18);
        const targetZ = b.depthBias * .45;

        const centerForce = loaded ? .0040 : .0055;
        b.velocity.x += (targetX - b.position.x) * centerForce * interactionBoost;
        b.velocity.y += (targetY - b.position.y) * centerForce * interactionBoost;
        b.velocity.z += (targetZ - b.position.z) * centerForce * .85;

        if (appState.interaction === "thinking") {
          const pulse = 1 + Math.sin(t * 4 + b.id * .3) * .18;
          b.velocity.x += b.position.x * .00016 * pulse;
          b.velocity.y += b.position.y * .00016 * pulse;
        }

        const interacting = Math.abs(mouse.x) < .99 || Math.abs(mouse.y) < .99;
        if (interacting) {
          tmp.subVectors(b.position, mouseWorld);
          const dist = tmp.length();
          const radius = mouse.isDown ? 5.3 : 4.4;
          const force = mouse.isDown ? .085 : .05;

          if (dist < radius && dist > .001) {
            const ratio = dist / radius;
            const smooth = 1 - (ratio * ratio * (3 - 2 * ratio));
            const speedBoost = 1 + mouseSpeed * 3.2;
            const push = smooth * force * speedBoost;
            tmp.normalize();
            tmp.z *= .12;
            tmp.normalize();
            b.velocity.addScaledVector(tmp, push);
          }
        }

        b.velocity.multiplyScalar(.91);
        b.position.add(b.velocity);

        const xBound = viewportWidth / 2 - .35;
        const yBound = viewportHeight / 2 - .25;
        const zBound = 2;

        if (b.position.x < -xBound) {
          b.position.x = -xBound;
          b.velocity.x *= -.3;
        } else if (b.position.x > xBound) {
          b.position.x = xBound;
          b.velocity.x *= -.3;
        }

        if (b.position.y < -yBound) {
          b.position.y = -yBound;
          b.velocity.y *= -.3;
        } else if (b.position.y > yBound) {
          b.position.y = yBound;
          b.velocity.y *= -.3;
        }

        if (b.position.z < -zBound) {
          b.position.z = -zBound;
          b.velocity.z *= -.3;
        } else if (b.position.z > zBound) {
          b.position.z = zBound;
          b.velocity.z *= -.3;
        }

        const c = paletteCurrent[b.role] || paletteCurrent.medium;
        b.material.color.copy(c);
        b.material.emissive.copy(c);

        if (b.isGlass && b.material.attenuationColor) {
          b.material.attenuationColor.copy(paletteCurrent.pastel);
        }
      }

      // Pairwise collisions
      const collideScale = .20;
      const subSteps = isMobile ? 2 : 3;

      for (let step = 0; step < subSteps; step++) {
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            const b1 = balls[i];
            const b2 = balls[j];

            collideDiff.subVectors(b2.position, b1.position);
            const dist = collideDiff.length();
            const minDist = b1.radius + b2.radius;

            if (dist < minDist && dist > .001) {
              const overlap = minDist - dist;
              collideDiff.multiplyScalar(1 / dist);

              const totalMass = b1.mass + b2.mass;
              const ratio1 = b2.mass / totalMass;
              const ratio2 = b1.mass / totalMass;

              b1.position.addScaledVector(collideDiff, -overlap * ratio1 * collideScale);
              b2.position.addScaledVector(collideDiff, overlap * ratio2 * collideScale);

              relVel.subVectors(b2.velocity, b1.velocity);
              const velAlongNormal = relVel.dot(collideDiff);

              if (velAlongNormal < -.0001) {
                const impulse = -(1.02) * velAlongNormal / (1 / b1.mass + 1 / b2.mass);
                b1.velocity.addScaledVector(collideDiff, -impulse / b1.mass);
                b2.velocity.addScaledVector(collideDiff, impulse / b2.mass);
              }
            }
          }
        }
      }

      for (const b of balls) {
        deltaPos.copy(b.position).sub(b.group.position);

        if (deltaPos.lengthSq() > .000001) {
          rotAxis.set(deltaPos.y, -deltaPos.x, 0).normalize();
          b.group.rotateOnWorldAxis(rotAxis, (deltaPos.length() / b.radius) * .72);
        }

        b.group.position.copy(b.position);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      updateFrustumBounds();
    });

    // =========================================================
    // LOADER
    // =========================================================
    const loader = $("#loader");
    const loaderStatus = $("#loaderStatus");
    const loaderFill = $("#loaderFill");
    const loaderCount = $("#loaderCount");

    let loadValue = 0;
    let lastLoadTime = performance.now();
    let sceneReady = false;

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        sceneReady = true;
      });
    });

    function tickLoader(now) {
      const dt = Math.min((now - lastLoadTime) / 1000, .05);
      lastLoadTime = now;

      const ceiling = sceneReady ? 100 : 92;
      const speed = sceneReady ? 6 : 1.7;
      loadValue += (ceiling - loadValue) * speed * dt;

      if (sceneReady && loadValue >= 99.4) loadValue = 100;

      loaderFill.style.width = `${loadValue}%`;
      loaderCount.textContent = `${Math.round(loadValue).toString().padStart(3, "0")}%`;

      if (loadValue >= 99.9 && sceneReady) {
        loaderStatus.textContent = "KURAMA ONLINE";

        setTimeout(() => {
          loader.classList.add("leave");
          document.body.classList.add("ready");
          loaded = true;
          entranceTime = clock.getElapsedTime();
        }, 140);

        return;
      }

      requestAnimationFrame(tickLoader);
    }

    requestAnimationFrame(tickLoader);

    function buildPaletteCard(palette) {
      const card = document.createElement("div");
      card.className = "palette-card";

      const head = document.createElement("div");
      head.className = "palette-head";

      const left = document.createElement("div");

      const name = document.createElement("div");
      name.className = "palette-name";
      name.textContent = palette.name || "Generated Palette";

      const mood = document.createElement("div");
      mood.className = "palette-mood";
      mood.textContent = Array.isArray(palette.mood)
        ? palette.mood.join(" / ")
        : "";

      left.append(name, mood);

      const apply = document.createElement("button");
      apply.type = "button";
      apply.className = "apply-btn";
      apply.textContent = "Apply Palette";
      apply.addEventListener("click", () => applyPaletteToScene(palette));

      head.append(left, apply);
      card.appendChild(head);

      const swatches = document.createElement("div");
      swatches.className = "swatches";

      for (const color of palette.colors || []) {
        const swatch = document.createElement("div");
        swatch.className = "swatch";

        const preview = document.createElement("div");
        preview.className = "swatch-color";
        preview.style.background = normalizeHex(color.hex);

        const meta = document.createElement("div");
        meta.className = "swatch-meta";

        const role = document.createElement("div");
        role.className = "swatch-role";
        role.textContent = color.role || "color";

        const hex = document.createElement("button");
        hex.className = "hex-btn";
        hex.type = "button";
        hex.textContent = normalizeHex(color.hex);
        hex.title = "Click to copy HEX code";

        hex.addEventListener("click", async () => {
          const original = hex.textContent;

          try {
            await navigator.clipboard.writeText(normalizeHex(color.hex));
            hex.textContent = "COPIED";
          } catch {
            hex.textContent = "COPIED";
          }

          setTimeout(() => {
            hex.textContent = original;
          }, 950);
        });

        const usage = document.createElement("div");
        usage.className = "swatch-usage";
        usage.textContent = color.usage || "";

        meta.append(role, hex, usage);
        swatch.append(preview, meta);
        swatches.appendChild(swatch);
      }

      card.appendChild(swatches);

      if (palette.contrast && typeof palette.contrast === "object") {
        const contrast = document.createElement("div");
        contrast.className = "contrast-box";

        for (const [key, value] of Object.entries(palette.contrast)) {
          if (!value) continue;

          const row = document.createElement("div");
          row.className = "contrast-row";

          const k = document.createElement("div");
          k.className = "contrast-key";
          k.textContent = key.replaceAll("_", " ");

          const v = document.createElement("div");
          v.className = "contrast-value";
          v.textContent = `${value.ratio || ""} ${value.status ? "· " + value.status : ""}`;

          row.append(k, v);
          contrast.appendChild(row);
        }

        card.appendChild(contrast);
      }

      return card;
    }

    function addBotMessage(reply, palette) {
      removeEmptyState();

      const row = document.createElement("div");
      row.className = "message-row bot";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const text = document.createElement("p");
      text.className = "bot-text";
      text.textContent = reply || "Here is a palette for your design.";

      bubble.appendChild(text);

      if (palette) {
        bubble.appendChild(buildPaletteCard(palette));
      }

      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    async function sendMessage(message) {
      const clean = String(message || "").trim();

      if (!clean || appState.isLoading) return;

      addUserMessage(clean);

      appState.history.push({
        role: "user",
        content: clean
      });

      appState.isLoading = true;
      appState.interaction = "thinking";
      sendBtn.disabled = true;

      showThinking();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: clean,
            history: appState.history.slice(-10)
          })
        });

        if (!response.ok) {
          throw new Error(`KURAMA API returned ${response.status}`);
        }

        const data = await response.json();

        hideThinking();
        addBotMessage(data.reply, data.palette);

        appState.history.push({
          role: "assistant",
          content: data.reply || ""
        });

        if (data.palette) {
          appState.activePalette = data.palette;
          applyPaletteToScene(data.palette);
        }

      } catch (error) {
        console.warn("Backend unavailable, using client fallback engine:", error.message);
        setTimeout(() => {
          hideThinking();
          const fallback = getFallbackPalette(clean);
          addBotMessage(fallback.reply, fallback);
          appState.history.push({
            role: "assistant",
            content: fallback.reply
          });
          appState.activePalette = fallback;
          applyPaletteToScene(fallback);
        }, 400);
      } finally {
        appState.isLoading = false;
        appState.interaction = "idle";
        sendBtn.disabled = false;
        chatInput.focus();
      }
    }

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const value = chatInput.value;
      chatInput.value = "";
      autoResize();
      sendMessage(value);
    });

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        chatForm.requestSubmit();
      }
    });

    chatInput.addEventListener("input", () => {
      autoResize();
      appState.interaction = chatInput.value.trim() ? "typing" : "idle";
    });

    chatInput.addEventListener("blur", () => {
      if (!appState.isLoading) appState.interaction = "idle";
    });

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        sendMessage(chip.dataset.prompt);
      });
    });

    function autoResize() {
      chatInput.style.height = "auto";
      chatInput.style.height = Math.min(chatInput.scrollHeight, 126) + "px";
    }

    // =========================================================
    // PALETTE CONTROL
    // =========================================================
    function normalizeHex(hex) {
      const raw = String(hex || "").trim().replace("#", "");

      if (/^[0-9a-fA-F]{3}$/.test(raw)) {
        return "#" + raw.split("").map(ch => ch + ch).join("").toUpperCase();
      }

      if (/^[0-9a-fA-F]{6}$/.test(raw)) {
        return "#" + raw.toUpperCase();
      }

      return "#2F69FF";
    }

    function paletteToMap(palette) {
      const map = {};

      for (const item of palette.colors || []) {
        if (!item?.role) continue;
        map[String(item.role).toLowerCase()] = normalizeHex(item.hex);
      }

      return map;
    }

    function mixHex(a, b, t) {
      const ca = new THREE.Color(normalizeHex(a));
      const cb = new THREE.Color(normalizeHex(b));
      ca.lerp(cb, t);
      return "#" + ca.getHexString().toUpperCase();
    }

    function updateScenePalette(next) {
      if (next.pastel) paletteTarget.pastel.set(normalizeHex(next.pastel));
      if (next.light) paletteTarget.light.set(normalizeHex(next.light));
      if (next.medium) paletteTarget.medium.set(normalizeHex(next.medium));
      if (next.deep) paletteTarget.deep.set(normalizeHex(next.deep));
      if (next.glass) paletteTarget.glass.set(normalizeHex(next.glass));
    }

    function updateUIPalette(map) {
      const root = document.documentElement;

      root.style.setProperty("--kurama-primary", map.primary || DEFAULT_THEME.primary);
      root.style.setProperty("--kurama-secondary", map.secondary || DEFAULT_THEME.secondary);
      root.style.setProperty("--kurama-accent", map.accent || map.primary || DEFAULT_THEME.accent);
      root.style.setProperty("--kurama-text", map.text || DEFAULT_THEME.text);
      root.style.setProperty("--kurama-surface", map.surface || DEFAULT_THEME.surface);
      root.style.setProperty("--kurama-bg", map.background || DEFAULT_THEME.background);
    }

    function updateBackground(map) {
      const background = map.background || DEFAULT_THEME.background;
      const surface = map.surface || DEFAULT_THEME.surface;
      const primary = map.primary || DEFAULT_THEME.primary;

      const edge = mixHex(background, primary, .24);
      const mid = mixHex(background, surface, .58);

      bgGradient.style.background =
        `radial-gradient(circle at 50% 45%,
          ${surface} 0%,
          ${mid} 38%,
          ${edge} 100%)`;
    }

    function applyPaletteToScene(palette) {
      const map = paletteToMap(palette);

      const primary = map.primary || DEFAULT_THEME.primary;
      const secondary = map.secondary || primary;
      const accent = map.accent || secondary;
      const surface = map.surface || "#FFFFFF";
      const background = map.background || "#F7FAFC";

      updateScenePalette({
        pastel: mixHex(surface, background, .38),
        light: secondary,
        medium: primary,
        deep: accent,
        glass: mixHex(primary, secondary, .35)
      });

      updateBackground(map);
      updateUIPalette(map);

      appState.activePalette = palette;
      appState.interaction = "thinking";

      setTimeout(() => {
        if (!appState.isLoading) appState.interaction = "idle";
      }, 850);
    }

    function resetKurama() {
      appState.history = [];
      appState.activePalette = null;
      appState.isLoading = false;
      appState.interaction = "idle";

      messagesEl.innerHTML = `
        <div class="empty-state" id="emptyState">
          <div class="empty-kicker">COLOR SYSTEM GENERATOR</div>
          <h1>Describe what<br>you're designing.</h1>
          <p>I'll build a color system around it.</p>

          <div class="quick-prompts">
            <button class="chip" data-prompt="Create a professional color palette for a modern website">Website</button>
            <button class="chip" data-prompt="Create a clean color palette for a mobile app">Mobile App</button>
            <button class="chip" data-prompt="Create a dark AI dashboard color palette">Dashboard</button>
            <button class="chip" data-prompt="Create a minimal luxury portfolio palette">Portfolio</button>
            <button class="chip" data-prompt="Create a strong modern brand identity palette">Brand</button>
            <button class="chip" data-prompt="Create a dark tactical gaming UI color palette">Gaming</button>
            <button class="chip" data-prompt="Create a premium SaaS product color palette">SaaS</button>
            <button class="chip" data-prompt="Create a warm modern e-commerce color palette">E-commerce</button>
          </div>
        </div>
      `;

      document.querySelectorAll(".chip").forEach((chip) => {
        chip.addEventListener("click", () => sendMessage(chip.dataset.prompt));
      });

      updateScenePalette({
        pastel: "#ECEFFF",
        light: "#A8C1FF",
        medium: "#2F69FF",
        deep: "#0A33BF",
        glass: "#4D80FF"
      });

      updateUIPalette(DEFAULT_THEME);

      bgGradient.style.background =
        "radial-gradient(circle at 50% 45%, #ffffff 0%, #ecefff 36%, #c2d1ff 100%)";

      chatInput.value = "";
      autoResize();
      chatInput.focus();
    }

    resetBtn.addEventListener("click", resetKurama);

    // Optional health check
    fetch("/api/health")
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(data => console.log("KURAMA backend:", data))
      .catch(() => console.warn("KURAMA backend health check failed"));
  </script>
</body>
</html>
